			<div class="more"><h1 id="optional-values">Optional Values</h1>
<p>To define properties or method parameters as optional, wrap the name with square brackets.</p>
<pre><code>@prop {object} [foo]</code></pre>
<p>When the property has a default value, keep the value within the square brackets as well</p>
<pre><code>@prop {object} [foo="bar"]</code></pre></div>
